<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no">
    <meta name="theme-color" content="#667eea">
    <title>恋爱观测试问卷</title>
    <script>
        function QRCode(el, options) {
            this.options = {
                width: 256,
                height: 256,
                colorDark: '#000000',
                colorLight: '#ffffff',
                correctLevel: 2,
                text: ''
            };
            for (var key in options) {
                this.options[key] = options[key];
            }
            this.el = typeof el === 'string' ? document.getElementById(el) : el;
            
            if (this.options.text) {
                this.makeCode(this.options.text);
            }
        }

        QRCode.prototype.makeCode = function(text) {
            var qrcode = new QRCodeModel(text, this.options.correctLevel);
            var modules = qrcode.getData();
            var moduleCount = modules.length;
            
            var canvas = document.createElement('canvas');
            canvas.width = this.options.width;
            canvas.height = this.options.height;
            var ctx = canvas.getContext('2d');
            
            var tileW = this.options.width / moduleCount;
            var tileH = this.options.height / moduleCount;
            
            for (var row = 0; row < moduleCount; row++) {
                for (var col = 0; col < moduleCount; col++) {
                    ctx.fillStyle = modules[row][col] ? this.options.colorDark : this.options.colorLight;
                    ctx.fillRect(col * tileW, row * tileH, tileW, tileH);
                }
            }
            
            this.el.innerHTML = '';
            this.el.appendChild(canvas);
        };

        function QRCodeModel(text, correctLevel) {
            this.text = text;
            this.correctLevel = correctLevel || 2;
            this.version = this.getVersion();
            this.data = this.encodeData();
        }

        QRCodeModel.prototype.getVersion = function() {
            var length = this.text.length;
            for (var v = 1; v <= 40; v++) {
                var capacity = this.getCapacity(v, this.correctLevel);
                if (capacity >= length) return v;
            }
            return 40;
        };

        QRCodeModel.prototype.getCapacity = function(version, level) {
            var capacities = [
                [26,19],[44,34],[70,55],[100,80],[134,108],[174,139],[192,154],[220,178],[250,206],[282,236],
                [316,260],[352,292],[386,320],[422,350],[460,382],[500,416],[542,452],[586,490],[632,530],[674,574],
                [728,620],[784,668],[842,720],[902,774],[964,830],[1028,890],[1094,952],[1162,1016],[1232,1082],[1304,1150],
                [1378,1220],[1454,1292],[1532,1366],[1612,1442],[1694,1520],[1778,1600],[1864,1682],[1952,1766],[2042,1852],[2134,1940]
            ];
            var index = version - 1;
            return capacities[index] ? capacities[index][1] : 1940;
        };

        QRCodeModel.prototype.encodeData = function() {
            var data = [];
            data.push(4);
            data.push((this.text.length << 8) | (this.text.length >> 8));
            for (var i = 0; i < this.text.length; i++) {
                data.push(this.text.charCodeAt(i));
            }
            return this.addErrorCorrection(data);
        };

        QRCodeModel.prototype.addErrorCorrection = function(data) {
            var blocks = this.getBlocks(data);
            var result = [];
            for (var i = 0; i < blocks.length; i++) {
                result = result.concat(blocks[i]);
            }
            return result;
        };

        QRCodeModel.prototype.getBlocks = function(data) {
            var blockCount = this.correctLevel === 0 ? 1 : this.correctLevel === 1 ? 1 : this.correctLevel === 2 ? 2 : 4;
            var blockSize = Math.ceil(data.length / blockCount);
            var blocks = [];
            
            for (var i = 0; i < blockCount; i++) {
                var start = i * blockSize;
                var end = Math.min(start + blockSize, data.length);
                blocks.push(data.slice(start, end));
            }
            return blocks;
        };

        QRCodeModel.prototype.getData = function() {
            var size = this.version * 4 + 17;
            var modules = [];
            for (var i = 0; i < size; i++) {
                modules[i] = [];
                for (var j = 0; j < size; j++) {
                    modules[i][j] = false;
                }
            }
            
            this.drawPositionProbe(modules, 0, 0);
            this.drawPositionProbe(modules, size - 7, 0);
            this.drawPositionProbe(modules, 0, size - 7);
            
            this.drawTimingPattern(modules, size);
            
            var dataIndex = 0;
            var data = this.data;
            
            for (var row = size - 1; row >= 0; row -= 2) {
                if (row === 6) row--;
                for (var col = 0; col < size; col++) {
                    for (var dr = 0; dr < 2; dr++) {
                        var r = row - dr;
                        if (r >= 0 && !modules[r][col]) {
                            modules[r][col] = (data[dataIndex % data.length] >> (7 - (dataIndex % 8))) & 1;
                            dataIndex++;
                        }
                    }
                }
            }
            
            return modules;
        };

        QRCodeModel.prototype.drawPositionProbe = function(modules, row, col) {
            for (var i = -1; i <= 7; i++) {
                for (var j = -1; j <= 7; j++) {
                    if (row + i >= 0 && row + i < modules.length && col + j >= 0 && col + j < modules.length) {
                        modules[row + i][col + j] = (i >= 0 && i <= 6 && (j === 0 || j === 6)) || (j >= 0 && j <= 6 && (i === 0 || i === 6));
                    }
                }
            }
        };

        QRCodeModel.prototype.drawTimingPattern = function(modules, size) {
            for (var i = 8; i < size - 8; i++) {
                modules[6][i] = i % 2 === 0;
                modules[i][6] = i % 2 === 0;
            }
        };

        window.QRCode = QRCode;
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 640px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 1.5rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #3B82F6, #2563EB);
            color: white;
            padding: 2rem;
            text-align: center;
            position: relative;
        }

        .header h1 {
            font-size: 1.875rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .header p {
            font-size: 0.875rem;
            opacity: 0.9;
        }

        .content {
            padding: 2rem;
        }

        .progress-bar {
            margin-bottom: 2rem;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            color: #6B7280;
        }

        .progress-track {
            width: 100%;
            height: 8px;
            background: #E5E7EB;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #3B82F6, #2563EB);
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        .question {
            background: #F9FAFB;
            border-radius: 1rem;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border-left: 4px solid #3B82F6;
        }

        .question-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .question-number {
            background: #3B82F6;
            color: white;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
        }

        .question-type {
            font-size: 0.75rem;
            color: #9CA3AF;
        }

        .question-text {
            font-size: 1rem;
            font-weight: 600;
            color: #1F2937;
            margin-bottom: 1rem;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .option {
            display: flex;
            align-items: center;
            padding: 1rem;
            background: white;
            border: 2px solid #E5E7EB;
            border-radius: 0.75rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option:hover {
            border-color: #3B82F6;
            background: #EFF6FF;
        }

        .option.selected {
            border-color: #3B82F6;
            background: #DBEAFE;
        }

        .option-checkbox {
            width: 1.25rem;
            height: 1.25rem;
            border: 2px solid #D1D5DB;
            border-radius: 0.25rem;
            margin-right: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .option.selected .option-checkbox {
            background: #3B82F6;
            border-color: #3B82F6;
        }

        .option-checkbox::after {
            content: '✓';
            color: white;
            font-size: 0.75rem;
            display: none;
        }

        .option.selected .option-checkbox::after {
            display: block;
        }

        .option-text {
            flex: 1;
            font-size: 0.9375rem;
            color: #374151;
        }

        .submit-btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #10B981, #059669);
            color: white;
            border: none;
            border-radius: 0.75rem;
            font-size: 1.125rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1.5rem;
        }

        .submit-btn:hover:not(:disabled) {
            transform: scale(1.02);
            box-shadow: 0 10px 30px rgba(16, 185, 129, 0.4);
        }

        .submit-btn:disabled {
            background: #D1D5DB;
            cursor: not-allowed;
        }

        /* 二维码页面样式 */
        .qrcode-section {
            text-align: center;
            padding: 2rem;
        }

        .qrcode-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1F2937;
            margin-bottom: 0.5rem;
        }

        .qrcode-subtitle {
            font-size: 0.875rem;
            color: #6B7280;
            margin-bottom: 1.5rem;
        }

        .qrcode-box {
            background: white;
            padding: 1.5rem;
            border-radius: 1rem;
            display: inline-block;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .qrcode-url {
            background: #F3F4F6;
            padding: 1rem;
            border-radius: 0.5rem;
            margin-bottom: 1.5rem;
            word-break: break-all;
        }

        .qrcode-url-label {
            font-size: 0.75rem;
            color: #6B7280;
            margin-bottom: 0.25rem;
        }

        .qrcode-url-text {
            font-size: 0.75rem;
            font-family: monospace;
            color: #3B82F6;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .btn {
            padding: 0.875rem 1.5rem;
            border: none;
            border-radius: 0.75rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #3B82F6, #2563EB);
            color: white;
        }

        .btn-success {
            background: linear-gradient(135deg, #10B981, #059669);
            color: white;
        }

        .btn-secondary {
            background: linear-gradient(135deg, #6B7280, #4B5563);
            color: white;
        }

        .btn:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .tip {
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid #E5E7EB;
            font-size: 0.75rem;
            color: #9CA3AF;
        }

        /* 成功页面样式 */
        .success-section {
            text-align: center;
            padding: 3rem 2rem;
        }

        .success-icon {
            width: 6rem;
            height: 6rem;
            background: #D1FAE5;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            animation: bounce 1s ease infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .success-icon svg {
            width: 3rem;
            height: 3rem;
            color: #10B981;
        }

        .success-title {
            font-size: 1.875rem;
            font-weight: 700;
            color: #1F2937;
            margin-bottom: 0.5rem;
        }

        .success-message {
            color: #6B7280;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .success-highlight {
            background: linear-gradient(135deg, #ECFDF5, #DBEAFE);
            padding: 1.5rem;
            border-radius: 1rem;
            margin-bottom: 1.5rem;
        }

        .success-heart {
            width: 3rem;
            height: 3rem;
            background: #10B981;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
        }

        .success-heart svg {
            width: 1.5rem;
            height: 1.5rem;
            color: white;
        }

        .success-highlight p {
            font-size: 0.875rem;
            color: #374151;
            line-height: 1.6;
        }

        /* 已提交页面样式 */
        .already-submitted {
            text-align: center;
            padding: 2rem;
        }

        .already-submitted-icon {
            width: 5rem;
            height: 5rem;
            background: #FEF3C7;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
        }

        .already-submitted-icon svg {
            width: 2.5rem;
            height: 2.5rem;
            color: #F59E0B;
        }

        /* 导航按钮 */
        .nav-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: white;
            color: #3B82F6;
            padding: 0.75rem 1.5rem;
            border-radius: 9999px;
            font-weight: 600;
            text-decoration: none;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }

        .nav-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }

        .nav-btn svg {
            width: 1.25rem;
            height: 1.25rem;
        }

        /* 结果统计页面样式 */
        .stats-section {
            padding: 2rem;
        }

        .stats-summary {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: linear-gradient(135deg, #EEF2FF, #E0E7FF);
            padding: 1.25rem;
            border-radius: 1rem;
            text-align: center;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 700;
            color: #3B82F6;
            margin-bottom: 0.25rem;
        }

        .stat-label {
            font-size: 0.875rem;
            color: #6B7280;
        }

        .stat-question {
            background: #F9FAFB;
            border-radius: 1rem;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border-left: 4px solid #10B981;
        }

        .stat-question-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .stat-question-number {
            background: #10B981;
            color: white;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
        }

        .stat-question-text {
            font-size: 0.9375rem;
            font-weight: 600;
            color: #1F2937;
        }

        .stat-option {
            margin-bottom: 0.75rem;
        }

        .stat-option-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
        }

        .stat-option-name {
            color: #374151;
        }

        .stat-option-value {
            font-weight: 600;
            color: #3B82F6;
        }

        .stat-option-bar {
            width: 100%;
            height: 8px;
            background: #E5E7EB;
            border-radius: 4px;
            overflow: hidden;
        }

        .stat-option-fill {
            height: 100%;
            background: linear-gradient(90deg, #3B82F6, #10B981);
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        /* 开发者工具按钮 */
        .dev-tools-btn {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            width: 3.5rem;
            height: 3.5rem;
            background: linear-gradient(135deg, #10B981, #059669);
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .dev-tools-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 30px rgba(16, 185, 129, 0.5);
        }

        .dev-tools-btn svg {
            width: 1.75rem;
            height: 1.75rem;
        }

        /* 清空数据确认对话框 */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 1rem;
        }

        .modal-content {
            background: white;
            border-radius: 1rem;
            padding: 2rem;
            max-width: 400px;
            width: 100%;
        }

        .modal-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #1F2937;
            margin-bottom: 1rem;
        }

        .modal-text {
            color: #6B7280;
            margin-bottom: 1.5rem;
            line-height: 1.6;
        }

        .modal-buttons {
            display: flex;
            gap: 0.75rem;
        }

        .modal-btn {
            flex: 1;
            padding: 0.75rem;
            border: none;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .modal-btn-cancel {
            background: #E5E7EB;
            color: #374151;
        }

        .modal-btn-confirm {
            background: #EF4444;
            color: white;
        }

        .modal-btn:hover {
            opacity: 0.9;
        }

        /* 响应式调整 */
        @media (max-width: 640px) {
            body {
                padding: 1rem 0.5rem;
            }

            .header {
                padding: 1.5rem;
            }

            .header h1 {
                font-size: 1.5rem;
            }

            .content {
                padding: 1.5rem;
            }

            .question {
                padding: 1rem;
            }

            .stats-summary {
                grid-template-columns: 1fr;
            }

            .dev-tools-btn {
                bottom: 1rem;
                right: 1rem;
                width: 3rem;
                height: 3rem;
            }
        }

        /* 隐藏类 */
        .hidden {
            display: none !important;
        }

        /* 爱心Canvas */
        .heart-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 3000;
            background: rgba(10, 10, 20, 0.85);
        }

        .heart-text-overlay {
            position: relative;
            font-size: 3rem;
            font-weight: 700;
            color: white;
            text-shadow: 
                0 0 20px rgba(255, 107, 157, 1),
                0 0 40px rgba(255, 107, 157, 0.8),
                0 0 60px rgba(255, 107, 157, 0.6),
                0 0 80px rgba(255, 107, 157, 0.4),
                0 2px 10px rgba(0, 0, 0, 0.3);
            letter-spacing: 0.4em;
            margin-bottom: 1rem;
            animation: text-glow 2s ease-in-out infinite;
            z-index: 3001;
            display: inline-block;
        }

        @keyframes text-glow {
            0%, 100% {
                filter: drop-shadow(0 0 20px rgba(255, 107, 157, 0.8));
            }
            50% {
                filter: drop-shadow(0 0 40px rgba(255, 107, 157, 1));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 问卷页面 -->
        <div id="questionnaire-view" class="card">
            <div class="header">
                <h1 id="survey-title">加载中...</h1>
                <p id="survey-description"></p>
            </div>
            <div class="content">
                <div class="progress-bar">
                    <div class="progress-info">
                        <span>答题进度</span>
                        <span id="progress-text">0 / 0</span>
                    </div>
                    <div class="progress-track">
                        <div id="progress-fill" class="progress-fill" style="width: 0%"></div>
                    </div>
                </div>

                <div id="questions-container"></div>

                <button id="submit-btn" class="submit-btn" disabled>请完成所有问题</button>
            </div>
        </div>

        <!-- 二维码页面 -->
        <div id="qrcode-view" class="card hidden">
            <div class="header">
                <h1>分享二维码</h1>
                <p>扫描下方二维码填写问卷</p>
            </div>
            <div class="qrcode-section">
                <div class="qrcode-box">
                    <div id="qrcode"></div>
                </div>

                <div class="qrcode-url">
                    <div class="qrcode-url-label">问卷链接：</div>
                    <div id="qrcode-url-text" class="qrcode-url-text"></div>
                </div>

                <div class="btn-group">
                    <button id="download-qrcode" class="btn btn-primary">📥 下载二维码图片</button>
                    <button id="copy-link" class="btn btn-success">📋 复制问卷链接</button>
                </div>

                <p class="tip">💡 提示：将二维码图片发送给微信好友，或打印后张贴</p>

                <button id="back-to-questionnaire" class="nav-btn" style="margin-top: 1.5rem;">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>

        <!-- 结果统计页面 -->

            <div class="header">
                <h1>📊 调查结果</h1>

                <div class="stats-summary">
                    <div class="stat-card">
                        <div id="total-submissions" class="stat-number">0</div>
                        <div class="stat-label">总提交数</div>
                    </div>
                    <div class="stat-card">
                        <div id="completion-rate" class="stat-number">0%</div>
                        <div class="stat-label">完成率</div>

                <div id="stats-questions-container"></div>

                <div style="margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid #E5E7EB;">
                    <button id="export-data" class="btn btn-secondary" style="width: 100%; margin-bottom: 0.75rem;">
                        📥 导出数据 (JSON)
                    </button>
                    <button id="clear-data" class="btn btn-primary" style="width: 100%; background: linear-gradient(135deg, #EF4444, #DC2626);">
                        🗑️ 清空所有数据

                <button id="back-from-stats" class="nav-btn" style="width: 100%; margin-top: 1.5rem; justify-content: center;">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">

    <!-- 清空数据确认对话框 -->
    <div id="clear-confirm-modal" class="modal hidden">
        <div class="modal-content">
            <h3 class="modal-title">⚠️ 确认清空数据</h3>
            <p class="modal-text">
                此操作将删除所有提交的问卷数据，包括：<br>
                • 所有用户的回答记录<br>
                • 提交统计信息<br><br>
                <strong>此操作不可撤销！</strong>
            </p>
            <div class="modal-buttons">
                <button id="cancel-clear" class="modal-btn modal-btn-cancel">取消</button>
                <button id="confirm-clear" class="modal-btn modal-btn-confirm">确认清空</button>
            </div>
        </div>
    </div>

    <!-- 开发者工具按钮 -->
    <button id="dev-tools-btn" class="dev-tools-btn" title="查看调查结果">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
        </svg>
    </button>

    <script>
        // ==================== 问卷配置（开发者可修改） ====================
        const QUESTIONNAIRE_CONFIG = {
            title: "恋爱观测试问卷",
            description: "感谢您抽出宝贵时间填写此问卷。涵盖了依恋模式、冲突处理、付出与索取、未来规划等方面。",
            questions: [
                {
                    id: 1,
                    type: "single",
                    text: "当你的伴侣没有及时回复你的消息时，你的第一反应通常是？",
                    options: ["A. 淡定等待：Ta可能在忙，晚点再回也很正常，我有自己的事情要做。", "B. 轻度焦虑：开始胡思乱想，忍不住一直看手机，甚至会发朋友圈试探。", "C. 回避冷感：正好，我也想静静，不想被太频繁的消息打扰，有点烦。", "D. 反向施压：你不理我，那我也不理你，看谁先低头，甚至想直接断联。"]
                },
                {
                    id: 2,
                    type: "single",
                    text: "你们因为一件小事激烈争吵，且双方都有错，你会怎么做？",
                    options: ["A. 立刻服软：吵架太伤感情了，我宁愿认输也要马上和好，不想冷战。", "B. 理性复盘：先冷静下来，等情绪过去了，再坐下来分析谁对谁错。", "C. 坚持己见：我是对的，只要Ta不认错，我就绝不会先开口说话。", "D. 转移逃避：不想面对争吵，直接去睡觉或者出门，假装这件事没发生。"]
                },
                {
                    id: 3,
                    type: "single",
                    text: "恋爱中的经济支出和精力付出，你认为最理想的状态是？",
                    options: ["A. 完全AA：亲兄弟明算账，恋爱也要独立，谁也不欠谁，这样最轻松。", "B. 男方多付：传统观念里男生应该承担更多，但这不代表女生可以不付出（情绪价值）。", "C. 谁强谁付：谁赚钱多谁买单，或者谁发起约会谁付，注重实际能力。", "D. 互相馈赠：这顿你请，下次我请你更贵的；今天你照顾我，明天我照顾你，要有来有往。"]
                },
                {
                    id: 4,
                    type: "single",
                    text: "当你开始一段恋情，你对婚姻的态度是？",
                    options: ["A. 必婚主义：不以结婚为目的的恋爱都是耍流氓，谈恋爱就是为了成家。", "B. 体验主义：享受当下，顺其自然，结不结婚不重要，重要的是现在开心。", "C. 恐婚慎入：还没准备好进入围城，恋爱可以，但想到婚姻的责任就感到压力。", "D. 条件成熟：遇到对的人就结，但必须要有房、车、存款等硬性物质条件才敢结。"]
                },
                {
                    id: 5,
                    type: "single",
                    text: "如果你的伴侣非常优秀，但异性缘很好，你会？",
                    options: ["A. 完全信任：既然在一起就要互相信任，Ta的优秀也是我的骄傲，我不干涉。", "B. 暗中吃醋：虽然嘴上说没事，但心里很介意，会偶尔旁敲侧击地打听。", "C. 立下规矩：必须报备行踪，拒绝所有暧昧，异性朋友必须经过我审核。", "D. 自我提升：把这种危机感转化为动力，让自己变得更优秀，以此留住对方。"]
                }
            ]
        };

        // ==================== 应用状态 ====================
        let answers = {};
        let qrcodeInstance = null;

        // ==================== 初始化 ====================
        document.addEventListener('DOMContentLoaded', function() {
            checkSubmittedStatus();
            initializeQuestionnaire();
            setupEventListeners();
        });

        function checkSubmittedStatus() {
            const isSubmitted = localStorage.getItem('questionnaire_submitted');
            if (isSubmitted === 'true') {
                showView('already-submitted-view');
            }
        }

        function initializeQuestionnaire() {
            document.getElementById('survey-title').textContent = QUESTIONNAIRE_CONFIG.title;
            document.getElementById('survey-description').textContent = QUESTIONNAIRE_CONFIG.description;

            const container = document.getElementById('questions-container');
            container.innerHTML = '';

            QUESTIONNAIRE_CONFIG.questions.forEach((question, index) => {
                const questionHTML = createQuestionHTML(question, index);
                container.innerHTML += questionHTML;
            });

            updateProgress();
        }

        function createQuestionHTML(question, index) {
            const isMultiple = question.type === 'multiple';
            const typeText = isMultiple ? '（多选）' : '（单选）';

            let optionsHTML = question.options.map((option, optIndex) => `
                <div class="option" data-question-id="${question.id}" data-option="${option}" onclick="toggleOption(${question.id}, '${option.replace(/'/g, "\\'")}', ${isMultiple})">
                    <div class="option-checkbox"></div>
                    <span class="option-text">${option}</span>
                </div>
            `).join('');

            return `
                <div class="question">
                    <div class="question-header">
                        <span class="question-number">问题 ${index + 1}</span>
                        <span class="question-type">${typeText}</span>
                    </div>
                    <div class="question-text">${question.text}</div>
                    <div class="options">
                        ${optionsHTML}
                    </div>
                </div>
            `;
        }

        function toggleOption(questionId, option, isMultiple) {
            const optionElement = document.querySelector(`[data-question-id="${questionId}"][data-option="${option}"]`);

            if (isMultiple) {
                if (!answers[questionId]) {
                    answers[questionId] = [];
                }

                const index = answers[questionId].indexOf(option);
                if (index > -1) {
                    answers[questionId].splice(index, 1);
                    optionElement.classList.remove('selected');
                } else {
                    answers[questionId].push(option);
                    optionElement.classList.add('selected');
                }
            } else {
                document.querySelectorAll(`[data-question-id="${questionId}"]`).forEach(el => {
                    el.classList.remove('selected');
                });

                answers[questionId] = option;
                optionElement.classList.add('selected');
            }

            updateProgress();
        }

        function updateProgress() {
            const answeredCount = Object.keys(answers).filter(key => {
                const answer = answers[key];
                if (Array.isArray(answer)) {
                    return answer.length > 0;
                }
                return answer !== undefined && answer !== '';
            }).length;

            const totalQuestions = QUESTIONNAIRE_CONFIG.questions.length;
            const progressText = document.getElementById('progress-text');
            const progressFill = document.getElementById('progress-fill');
            const submitBtn = document.getElementById('submit-btn');

            progressText.textContent = `${answeredCount} / ${totalQuestions}`;
            progressFill.style.width = `${(answeredCount / totalQuestions) * 100}%`;

            if (answeredCount === totalQuestions) {
                submitBtn.disabled = false;
                submitBtn.textContent = '提交问卷';
            } else {
                submitBtn.disabled = true;
                submitBtn.textContent = `请完成所有问题 (${answeredCount}/${totalQuestions})`;
            }
        }

        function setupEventListeners() {
            document.getElementById('submit-btn').addEventListener('click', handleSubmit);
            document.getElementById('reset-btn').addEventListener('click', handleReset);
            document.getElementById('download-qrcode').addEventListener('click', downloadQRCode);
            document.getElementById('copy-link').addEventListener('click', copyLink);
            document.getElementById('back-to-questionnaire').addEventListener('click', () => showView('questionnaire-view'));
            document.getElementById('view-qrcode-btn').addEventListener('click', () => {
                initializeQRCode();
                showView('qrcode-view');
            });
            document.getElementById('dev-tools-btn').addEventListener('click', showStats);
            document.getElementById('back-from-stats').addEventListener('click', () => showView('questionnaire-view'));
            document.getElementById('export-data').addEventListener('click', exportData);
            document.getElementById('clear-data').addEventListener('click', showClearModal);
            document.getElementById('cancel-clear').addEventListener('click', hideClearModal);
            document.getElementById('confirm-clear').addEventListener('click', clearAllData);

            addNavigationButtons();
        }

        function addNavigationButtons() {
            const header = document.querySelector('#questionnaire-view .header');
            const navBtn = document.createElement('button');
            navBtn.className = 'nav-btn';
            navBtn.style.cssText = 'position: absolute; top: 1rem; right: 1rem; margin: 0; padding: 0.5rem 1rem;';
            navBtn.innerHTML = `
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" style="width: 1.25rem; height: 1.25rem;">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"/>
                </svg>
            `;
            navBtn.addEventListener('click', () => {
                initializeQRCode();
                showView('qrcode-view');
            });
            header.style.position = 'relative';
            header.appendChild(navBtn);
        }

        function handleSubmit() {
            const submission = {
                answers: answers,
                submittedAt: new Date().toISOString()
            };

            let submissions = JSON.parse(localStorage.getItem('all_submissions') || '[]');
            submissions.push(submission);
            localStorage.setItem('all_submissions', JSON.stringify(submissions));

            localStorage.setItem('questionnaire_submitted', 'true');
            localStorage.setItem('questionnaire_answers', JSON.stringify(answers));
            showView('success-view');
        }

        function handleReset() {
            answers = {};
            localStorage.removeItem('questionnaire_submitted');
            localStorage.removeItem('questionnaire_answers');

            document.querySelectorAll('.option').forEach(el => {
                el.classList.remove('selected');
            });

            updateProgress();
            showView('questionnaire-view');
        }

        function showView(viewId) {
            const views = ['questionnaire-view', 'qrcode-view', 'success-view', 'already-submitted-view', 'stats-view'];
            views.forEach(view => {
                document.getElementById(view).classList.add('hidden');
            });
            document.getElementById(viewId).classList.remove('hidden');

            if (viewId === 'qrcode-view') {
                initializeQRCode();
            }
            
            if (viewId === 'success-view') {
                initHeartParticles();
            }
            if (viewId === 'stats-view') {
                renderStats();
            }
        }

        function initializeQRCode() {
            const qrcodeContainer = document.getElementById('qrcode');
            const urlText = document.getElementById('qrcode-url-text');

            if (!qrcodeContainer || !urlText) {
                console.error('QRCode container not found');
                return;
            }

            qrcodeContainer.innerHTML = '';
            
            const currentUrl = window.location.href;
            urlText.textContent = currentUrl;

            if (currentUrl.startsWith('file://')) {
                qrcodeContainer.innerHTML = '<p style="color: #F59E0B; text-align: center; padding: 2rem;">⚠️ 当前是本地文件，请部署到服务器后再生成二维码</p>';
                return;
            }

            try {
                var encodedUrl = encodeURI(currentUrl);
                qrcodeInstance = new QRCode(qrcodeContainer, {
                    text: encodedUrl,
                    width: 256,
                    height: 256,
                    colorDark: '#1F2937',
                    colorLight: '#FFFFFF',
                    correctLevel: 2
                });
                console.log('QRCode generated successfully with encoded URL');
            } catch (error) {
                console.error('Error generating QRCode:', error);
                qrcodeContainer.innerHTML = '<p style="color: #EF4444; text-align: center; padding: 2rem;">生成二维码失败，请刷新重试</p>';
            }
        }

        function downloadQRCode() {
            const qrcodeContainer = document.getElementById('qrcode');
            const canvas = qrcodeContainer.querySelector('canvas');

            if (canvas) {
                const link = document.createElement('a');
                link.download = '问卷二维码.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            } else {
                const img = qrcodeContainer.querySelector('img');
                if (img) {
                    const link = document.createElement('a');
                    link.download = '问卷二维码.png';
                    link.href = img.src;
                    link.click();
                }
            }
        }

        function copyLink() {
            navigator.clipboard.writeText(window.location.href).then(() => {
                const btn = document.getElementById('copy-link');
                const originalText = btn.textContent;
                btn.textContent = '✅ 链接已复制！';
                setTimeout(() => {
                    btn.textContent = originalText;
                }, 2000);
            }).catch(err => {
                console.error('复制失败:', err);
                alert('复制失败，请手动复制链接');
            });
        }

        // ==================== 结果统计功能 ====================
        function showStats() {
            showView('stats-view');
        }

        function renderStats() {
            const submissions = JSON.parse(localStorage.getItem('all_submissions') || '[]');
            const totalSubmissions = submissions.length;

            document.getElementById('total-submissions').textContent = totalSubmissions;

            const totalPossible = totalSubmissions * QUESTIONNAIRE_CONFIG.questions.length;
            let totalAnswered = 0;
            submissions.forEach(sub => {
                Object.keys(sub.answers).forEach(key => {
                    const answer = sub.answers[key];
                    if (Array.isArray(answer)) {
                        totalAnswered += answer.length;
                    } else if (answer) {
                        totalAnswered += 1;
                    }
                });
            });
            const completionRate = totalPossible > 0 ? Math.round((totalAnswered / totalPossible) * 100) : 0;
            document.getElementById('completion-rate').textContent = completionRate + '%';

            const statsContainer = document.getElementById('stats-questions-container');
            statsContainer.innerHTML = '';

            QUESTIONNAIRE_CONFIG.questions.forEach((question, index) => {
                const optionCounts = {};
                question.options.forEach(option => {
                    optionCounts[option] = 0;
                });

                let answeredCount = 0;
                submissions.forEach(sub => {
                    const answer = sub.answers[question.id];
                    if (answer) {
                        answeredCount++;
                        if (Array.isArray(answer)) {
                            answer.forEach(a => {
                                if (optionCounts.hasOwnProperty(a)) {
                                    optionCounts[a]++;
                                }
                            });
                        } else {
                            if (optionCounts.hasOwnProperty(answer)) {
                                optionCounts[answer]++;
                            }
                        }
                    }
                });

                const statsHTML = `
                    <div class="stat-question">
                        <div class="stat-question-header">
                            <span class="stat-question-number">问题 ${index + 1}</span>
                            <span style="font-size: 0.75rem; color: #9CA3AF;">${answeredCount} 人回答</span>
                        </div>
                        <div class="stat-question-text">${question.text}</div>
                        <div style="margin-top: 1rem;">
                            ${question.options.map(option => {
                                const percentage = answeredCount > 0 ? Math.round((optionCounts[option] / answeredCount) * 100) : 0;
                                return `
                                    <div class="stat-option">
                                        <div class="stat-option-header">
                                            <span class="stat-option-name">${option}</span>
                                            <span class="stat-option-value">${optionCounts[option]} (${percentage}%)</span>
                                        </div>
                                        <div class="stat-option-bar">
                                            <div class="stat-option-fill" style="width: ${percentage}%"></div>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
                statsContainer.innerHTML += statsHTML;
            });

            if (totalSubmissions === 0) {
                statsContainer.innerHTML = `
                    <div style="text-align: center; padding: 3rem 1rem; color: #6B7280;">
                        <div style="font-size: 3rem; margin-bottom: 1rem;">📝</div>
                        <p style="font-size: 1.125rem; font-weight: 600; color: #374151; margin-bottom: 0.5rem;">暂无数据</p>
                        <p style="font-size: 0.875rem;">还没有人提交问卷，请分享二维码收集反馈</p>
                    </div>
                `;
            }
        }

        function exportData() {
            const submissions = JSON.parse(localStorage.getItem('all_submissions') || '[]');

            if (submissions.length === 0) {
                alert('暂无数据可导出');
                return;
            }

            const exportObj = {
                exportTime: new Date().toISOString(),
                questionnaireTitle: QUESTIONNAIRE_CONFIG.title,
                totalSubmissions: submissions.length,
                questions: QUESTIONNAIRE_CONFIG.questions,
                submissions: submissions
            };

            const dataStr = JSON.stringify(exportObj, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `问卷调查结果_${new Date().toISOString().split('T')[0]}.json`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        function showClearModal() {
            document.getElementById('clear-confirm-modal').classList.remove('hidden');
        }

        function hideClearModal() {
            document.getElementById('clear-confirm-modal').classList.add('hidden');
        }

        function clearAllData() {
            localStorage.removeItem('all_submissions');
            localStorage.removeItem('questionnaire_submitted');
            localStorage.removeItem('questionnaire_answers');
            answers = {};

            document.querySelectorAll('.option').forEach(el => {
                el.classList.remove('selected');
            });

            updateProgress();
            hideClearModal();
            showView('questionnaire-view');

            alert('所有数据已清空！');
        }

        let heartAnimationId = null;
        let particles = [];
        let shootingStars = [];

        function initHeartParticles() {
            const canvas = document.getElementById('heart-canvas');
            if (!canvas) return;

            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            particles = [];
            const particleCount = 500;
            
            for (let i = 0; i < particleCount; i++) {
                particles.push(createParticle());
            }

            shootingStars = [];
            const starCount = 30;
            for (let i = 0; i < starCount; i++) {
                shootingStars.push(createShootingStar());
            }

            if (heartAnimationId) {
                cancelAnimationFrame(heartAnimationId);
            }
            animateHeartParticles(ctx);
        }

        function createShootingStar() {
            const side = Math.random() > 0.5 ? 'left' : 'right';
            const startX = side === 'left' ? -50 : window.innerWidth + 50;
            const startY = Math.random() * window.innerHeight * 0.6;
            
            return {
                x: startX,
                y: startY,
                speedX: side === 'left' ? Math.random() * 8 + 5 : -(Math.random() * 8 + 5),
                speedY: Math.random() * 3 + 1,
                length: Math.random() * 60 + 30,
                alpha: Math.random() * 0.5 + 0.3,
                size: Math.random() * 2 + 1,
                active: Math.random() > 0.7
            };
        }

        function createParticle() {
            let x, y;
            let attempts = 0;
            
            do {
                x = (Math.random() - 0.5) * 4;
                y = (Math.random() - 0.5) * 4;
                attempts++;
            } while (!isInHeart(x, y) && attempts < 100);
            
            return {
                x: x,
                y: y,
                vx: (Math.random() - 0.5) * 0.02,
                vy: (Math.random() - 0.5) * 0.02,
                size: Math.random() * 4 + 2,
                alpha: Math.random() * 0.7 + 0.3,
                angle: Math.random() * Math.PI * 2,
                angleSpeed: (Math.random() - 0.5) * 0.03,
                length: Math.random() * 15 + 5
            };
        }

        function isInHeart(x, y) {
            const x2 = x * x;
            const y2 = y * y;
            const result = Math.pow(x2 + y2 - 1, 3) - x2 * y2 * y;
            return result < 0;
        }

        function animateHeartParticles(ctx) {
            ctx.fillStyle = 'rgba(10, 10, 20, 0.1)';
            ctx.fillRect(0, 0, ctx.canvas.width, ctx.canvas.height);

            drawShootingStars(ctx);

            const centerX = ctx.canvas.width / 2;
            const centerY = ctx.canvas.height * 0.45;
            const scale = 120;

            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.angle += p.angleSpeed;

                if (!isInHeart(p.x, p.y)) {
                    resetParticle2D(p);
                }

                const screenX = centerX + p.x * scale;
                const screenY = centerY - p.y * scale;

                const alpha = p.alpha;
                const size = p.size;

                ctx.save();
                ctx.translate(screenX, screenY);
                ctx.rotate(p.angle);

                const gradient = ctx.createLinearGradient(0, -p.length / 2, 0, p.length / 2);
                gradient.addColorStop(0, `rgba(255, 107, 157, 0)`);
                gradient.addColorStop(0.5, `rgba(255, 107, 157, ${alpha})`);
                gradient.addColorStop(1, `rgba(255, 143, 171, 0)`);

                ctx.beginPath();
                ctx.moveTo(0, -p.length / 2);
                ctx.lineTo(size / 2, p.length / 2);
                ctx.lineTo(-size / 2, p.length / 2);
                ctx.closePath();
                ctx.fillStyle = gradient;
                ctx.fill();

                ctx.beginPath();
                ctx.arc(0, 0, size / 2, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 143, 171, ${alpha * 0.8})`;
                ctx.fill();

                ctx.restore();
            });

            heartAnimationId = requestAnimationFrame(() => animateHeartParticles(ctx));
        }

        function drawShootingStars(ctx) {
            shootingStars.forEach(star => {
                if (!star.active) {
                    if (Math.random() < 0.02) {
                        star.active = true;
                        star.x = star.speedX > 0 ? -50 : window.innerWidth + 50;
                        star.y = Math.random() * window.innerHeight * 0.6;
                    }
                    return;
                }

                star.x += star.speedX;
                star.y += star.speedY;

                if (star.x < -100 || star.x > window.innerWidth + 100 || star.y > window.innerHeight) {
                    star.active = false;
                    return;
                }

                const tailX = star.x - star.speedX * 3;
                const tailY = star.y - star.speedY * 3;

                const gradient = ctx.createLinearGradient(tailX, tailY, star.x, star.y);
                gradient.addColorStop(0, 'rgba(255, 255, 255, 0)');
                gradient.addColorStop(0.5, `rgba(173, 216, 230, ${star.alpha * 0.5})`);
                gradient.addColorStop(1, `rgba(255, 255, 255, ${star.alpha})`);

                ctx.beginPath();
                ctx.moveTo(tailX, tailY);
                ctx.lineTo(star.x, star.y);
                ctx.strokeStyle = gradient;
                ctx.lineWidth = star.size;
                ctx.lineCap = 'round';
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size * 1.5, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${star.alpha})`;
                ctx.fill();

                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size * 3, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(173, 216, 230, ${star.alpha * 0.3})`;
                ctx.fill();
            });
        }

        function resetParticle2D(p) {
            let x, y;
            let attempts = 0;
            
            do {
                x = (Math.random() - 0.5) * 4;
                y = (Math.random() - 0.5) * 4;
                attempts++;
            } while (!isInHeart(x, y) && attempts < 100);
            
            p.x = x;
            p.y = y;
        }

        window.addEventListener('resize', () => {
            const canvas = document.getElementById('heart-canvas');
            if (canvas) {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
        });
    </script>
</body>
